<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sketchpad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
   <h1 class="heading">Etch-A-Sketch</h1>
    <div  class="sketchBoard"></div>
    <div class="inpContainer">
        <p class="gridSize">Enter Grid size: </p>
        <input type="number" value="16" min="1" max="100" step="1" required>
        <button class="SubmitBtn">Submit</button>
    </div>

    <div class="btnContainer">
       <button class="BlackBtn">Black</button>  
       <button class="GreyBtn">Grey</button>
       <button class="RandomBtn">Random</button>
       <button class="ResetBtn">Reset</button>       
    </div>
 </div>
</body>
<script src="main.js"></script>
</html>
